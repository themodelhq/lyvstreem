<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="152" height="152">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d946ef"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0abfc;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#d946ef;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- Shine overlay -->
  <rect width="512" height="512" rx="110" fill="url(#shine)"/>
  <!-- Camera body -->
  <rect x="80" y="160" width="300" height="210" rx="32" fill="white" opacity="0.95"/>
  <!-- Camera lens outer -->
  <circle cx="230" cy="265" r="75" fill="#1a1a26"/>
  <!-- Camera lens inner -->
  <circle cx="230" cy="265" r="52" fill="#d946ef"/>
  <!-- Camera lens center -->
  <circle cx="230" cy="265" r="28" fill="#1a1a26"/>
  <!-- Camera lens highlight -->
  <circle cx="218" cy="253" r="10" fill="white" opacity="0.5"/>
  <!-- Viewfinder dot -->
  <circle cx="338" cy="200" r="14" fill="#d946ef"/>
  <!-- Camera lens ring detail -->
  <circle cx="230" cy="265" r="40" fill="none" stroke="white" stroke-width="3" opacity="0.3"/>
  <!-- Video triangle / play -->
  <polygon points="390,210 390,320 450,265" fill="white" opacity="0.9"/>
  <!-- LIVE text bar -->
  <rect x="88" y="340" width="80" height="22" rx="6" fill="#ef4444"/>
  <text x="128" y="356" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">LIVE</text>
  <!-- Dot on LIVE -->
  <circle cx="93" cy="351" r="4" fill="white" opacity="0.8"/>
</svg>